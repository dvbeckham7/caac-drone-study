<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102a43" />
  <title>第一章 · 无人机基础速背</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./interaction.css?v=2" />
  <style>
    :root { --bg:#edf4ff; --panel:#ffffff; --panel-strong:#f5f9ff; --line:#dfeaf7; --navy:#17324d; --muted:#6a7f96; --blue:#2d6cdf; --blue-soft:#e8f0ff; --green:#1e8c6a; --green-soft:#eafaf4; --red:#d9585d; --red-soft:#fff1f1; --shadow:0 24px 60px rgba(23,50,77,.12); }
    * { box-sizing:border-box; }
    html, body { margin:0; }
    body {
      min-height:100vh;
      background:radial-gradient(circle at top, rgba(112,167,255,.18), transparent 26%), linear-gradient(180deg, #f6faff 0%, #edf3ff 100%);
      color:var(--navy);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
    }
    .app-shell { width:min(100%, 560px); margin:0 auto; padding:22px 18px 42px; }
    .topbar {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
    }
    .eyebrow { margin:0 0 4px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .topbar h1 { margin:0; font-size:clamp(28px, 6vw, 36px); letter-spacing:-.05em; }
    .icon-btn {
      width:42px; height:42px; border:1px solid rgba(21,46,72,.08); border-radius:14px;
      background:rgba(255,255,255,.82); color:var(--navy); font-size:22px; cursor:pointer;
      box-shadow:0 10px 22px rgba(17,40,59,.08);
    }
    .study-toolbar {
      display:flex; align-items:center; justify-content:space-between; gap:12px; margin:10px 0 18px;
    }
    .chapter-select {
      min-height:42px; max-width:150px; border:1px solid rgba(23,50,77,.08); border-radius:12px;
      background:rgba(255,255,255,.82); color:var(--navy); padding:0 10px; font:inherit; font-size:13px;
      font-weight:700; box-shadow:0 8px 16px rgba(17,40,59,.08); cursor:pointer;
    }
    .status-chip {
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:var(--blue-soft); color:var(--blue); font-size:12px; font-weight:700;
      letter-spacing:.04em; border:1px solid rgba(45,108,223,.08);
    }
    .progress-donut {
      width:64px; height:64px; border-radius:50%; position:relative; background:conic-gradient(#64d9b2 0deg, #64d9b2 0deg, #dfeaf7 0deg);
      display:grid; place-items:center; box-shadow:inset 0 0 0 1px rgba(23,50,77,.04);
    }
    .progress-donut::after {
      content:""; position:absolute; inset:8px; border-radius:50%; background:#f7fbff; border:1px solid rgba(19,35,52,.04);
    }
    .progress-donut span {
      position:relative; z-index:1; font-size:12px; font-weight:700; color:var(--navy);
    }
    .tab {
      appearance:none; border:1px solid rgba(23,50,77,.08); background:rgba(255,255,255,.8); color:var(--navy);
      border-radius:12px; padding:10px 14px; font-size:14px; font-weight:600; cursor:pointer;
      box-shadow:0 8px 16px rgba(17,40,59,.08);
    }
    .tab.active { background:var(--blue-soft); border-color:rgba(45,108,223,.15); color:var(--blue); }
    .tab span { margin-left:4px; }
    .progress-line {
      display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; margin:0 4px 12px;
    }
    .progress-line span:first-child { font-weight:700; color:var(--navy); }
    .flashcard {
      background:rgba(255,255,255,.92); border:1px solid rgba(142,170,204,.26); border-radius:28px; min-height:420px;
      padding:18px 18px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
    }
    .card-top { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
    .card-top span:first-child {
      display:inline-flex; align-items:center; padding:6px 10px; border-radius:999px;
      background:var(--green-soft); color:var(--green); font-weight:700; border:1px solid rgba(30,140,106,.08);
    }
    .card-top span:last-child { color:var(--muted); }
    .card-content { font-size:clamp(24px, 5vw, 32px); line-height:1.55; font-weight:700; letter-spacing:-.04em; }
    .choice-list { display:grid; gap:10px; margin-top:4px; }
    .choice {
      width:100%; display:flex; align-items:center; gap:12px; border:1px solid rgba(19,35,52,.08); border-radius:16px;
      background:#f9fbff; padding:14px 14px; color:var(--navy); font-size:16px; line-height:1.45;
      text-align:left; font-weight:600; cursor:pointer; transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .choice:hover { transform:translateY(-1px); border-color:rgba(45,108,223,.25); }
    .choice:disabled { cursor:default; opacity:1; }
    .choice span {
      width:28px; height:28px; display:grid; place-items:center; border-radius:50%;
      background:rgba(45,108,223,.08); color:var(--blue); font-size:13px; font-weight:800;
      flex:0 0 auto;
    }
    .choice.correct { background:var(--green-soft); border-color:rgba(30,140,106,.18); }
    .choice.correct span { background:var(--green); color:#fff; }
    .choice.muted { opacity:.5; }
    .feedback {
      margin-top:2px; padding:12px 14px; border-radius:16px; font-size:15px; line-height:1.7;
      border:1px solid transparent; background:#f5f8fc; color:var(--navy);
    }
    .feedback.good { background:var(--green-soft); border-color:rgba(30,140,106,.12); }
    .feedback.retry { background:var(--red-soft); border-color:rgba(217,88,93,.12); }
    .feedback b { display:block; margin-bottom:4px; }
    .feedback span { color:var(--muted); }
    .memory-guide { margin-top:12px; padding-top:10px; border-top:1px solid rgba(23,50,77,.1); color:var(--navy); font-size:12px; }
    .memory-guide b { margin-bottom:8px; color:var(--blue); }
    .guide-note { margin-top:7px; padding:6px 8px; background:#fff; border-left:3px solid #f2b84b; color:var(--navy); line-height:1.5; }
    .review-note { margin-top:8px; padding:7px 8px; background:#fff8e8; border-left:3px solid #e0a72e; color:var(--muted); line-height:1.5; }
    .review-note b { display:inline; margin-right:6px; color:#a56b00; }
    .scale, .scale-labels, .dual-range { display:grid; grid-template-columns:repeat(5, 1fr); gap:3px; text-align:center; }
    .scale span { padding:5px 2px; background:#e8f0ff; color:var(--blue); font-weight:800; border-bottom:3px solid #64d9b2; }
    .scale-labels { color:var(--muted); font-size:11px; }
    .threshold-value { margin-top:4px; padding:10px 12px; background:#fff; border-left:4px solid #f2b84b; color:var(--navy); font-size:16px; line-height:1.5; font-weight:700; }
    .threshold-value .guide-note { margin:0; padding:0; border:0; background:none; }
    .threshold-number { margin:4px 0 8px; color:#a56b00; font-size:30px; line-height:1.15; font-weight:900; letter-spacing:.02em; }
    .classification-ruler { display:grid; grid-template-columns:repeat(4, 1fr); gap:3px; }
    .classification-ruler > div { display:flex; flex-direction:column; gap:4px; min-width:0; padding:8px 6px; background:#e8f0ff; border-bottom:4px solid #64d9b2; text-align:center; }
    .classification-ruler > div:nth-child(2) { border-bottom-color:#f2b84b; }
    .classification-ruler > div:nth-child(3) { border-bottom-color:#e28b62; }
    .classification-ruler > div:nth-child(4) { border-bottom-color:#d9585d; }
    .classification-ruler strong { color:var(--navy); font-size:14px; }
    .classification-ruler span { color:var(--blue); font-size:12px; font-weight:800; white-space:nowrap; }
    .classification-ruler.heavy { grid-template-columns:repeat(2, 1fr); }
    .range-ruler { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px; color:var(--muted); font-size:11px; }
    .range-track { position:relative; height:10px; border-radius:99px; background:linear-gradient(90deg, #dfeaf7 0 43%, #f2b84b 43% 57%, #64d9b2 57%); }
    .range-track strong { position:absolute; left:50%; top:-20px; transform:translateX(-50%); color:#a56b00; font-size:10px; white-space:nowrap; }
    .dual-range { grid-template-columns:1fr 1fr; gap:8px; }
    .dual-range span { padding:7px; border-radius:8px; background:#e8f0ff; color:var(--blue); font-weight:700; }
    .dual-range.muted { margin-top:4px; color:var(--muted); }
    .dual-range.muted span { padding:0; background:none; font-weight:400; }
    .formula-guide { display:flex; align-items:center; justify-content:space-between; gap:6px; padding:7px 8px; background:#e8f0ff; color:var(--blue); font-weight:700; }
    .formula-guide strong { color:#64a88e; }
    .continue-btn {
      margin-top:auto; border:0; border-radius:14px; background:linear-gradient(135deg, #2d6cdf, #3f8efc);
      color:#fff; min-height:48px; font-size:16px; font-weight:700; box-shadow:0 12px 22px rgba(45,108,223,.24); cursor:pointer;
    }
    .list-head { display:flex; justify-content:space-between; align-items:center; margin:8px 2px 10px; color:var(--muted); font-size:12px; }
    .list-head strong { font-size:13px; color:var(--navy); }
    .question-list { display:grid; gap:10px; }
    .question-item {
      display:grid; grid-template-columns:32px minmax(0,1fr); gap:10px; align-items:flex-start;
      background:rgba(255,255,255,.8); border:1px solid rgba(142,170,204,.22); border-radius:16px; padding:12px 12px;
      width:100%; color:var(--navy); text-align:left; font:inherit; cursor:pointer;
    }
    .question-item:hover { border-color:rgba(45,108,223,.25); box-shadow:0 8px 18px rgba(23,50,77,.08); }
    .qnum { width:32px; height:32px; display:grid; place-items:center; border-radius:10px; background:var(--blue-soft); color:var(--blue); font-size:12px; font-weight:800; }
    .qtext, .qans { font-size:14px; line-height:1.6; color:var(--navy); }
    .qans { margin-top:6px; color:var(--green); }
    .empty-state { padding:20px 16px; border:1px dashed rgba(102,120,145,.32); border-radius:16px; color:var(--muted); background:rgba(255,255,255,.5); }
    .exam-panel { display:grid; gap:14px; }
    .exam-meta { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px; }
    .exam-timer { color:var(--blue); font-weight:800; font-variant-numeric:tabular-nums; }
    .exam-question { background:rgba(255,255,255,.92); border:1px solid rgba(142,170,204,.26); border-radius:24px; padding:20px 18px; box-shadow:var(--shadow); }
    .exam-question h2 { margin:0 0 18px; font-size:22px; line-height:1.55; }
    .exam-question .choice.exam-selected { background:var(--blue-soft); border-color:rgba(45,108,223,.3); }
    .exam-question .choice.exam-selected span { background:var(--blue); color:#fff; }
    .exam-actions { display:flex; gap:10px; }
    .exam-actions button { flex:1; min-height:48px; border:1px solid rgba(23,50,77,.1); border-radius:14px; background:#fff; color:var(--navy); font:inherit; font-weight:700; cursor:pointer; }
    .exam-actions button:last-child { background:var(--blue); color:#fff; border-color:var(--blue); }
    .exam-result { background:var(--green-soft); border:1px solid rgba(30,140,106,.15); border-radius:18px; padding:18px; line-height:1.8; }
    .exam-result.fail { background:var(--red-soft); border-color:rgba(217,88,93,.15); }
    .study-plan { display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"stage reward" "hint reward" "daily accuracy"; gap:7px 14px; margin:0 0 16px; padding:15px 16px; border:1px solid rgba(142,170,204,.22); border-radius:16px; background:rgba(255,255,255,.7); }
    .study-plan strong { grid-area:stage; font-size:14px; }
    .study-plan small { color:var(--muted); font-size:12px; line-height:1.5; }
    .study-plan #stageHint { grid-area:hint; }
    .study-plan #dailyTask { grid-area:daily; }
    .study-plan #accuracyLabel { grid-area:accuracy; color:var(--blue); font-weight:700; text-align:right; }
    .daily-reward { grid-area:reward; align-self:center; color:var(--green); font-size:12px; font-weight:800; text-align:right; white-space:nowrap; }
    .chapter-levels { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:8px; margin:0 0 16px; }
    .level-btn { min-height:38px; border:1px solid rgba(23,50,77,.1); border-radius:10px; background:rgba(255,255,255,.76); color:var(--navy); font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
    .level-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }
    .level-btn.complete { border-color:rgba(30,140,106,.25); color:var(--green); }
    .level-btn:disabled { color:#9aafbe; background:rgba(231,238,246,.72); cursor:not-allowed; }
    [hidden] { display:none !important; }
    @media (max-width:420px) {
      .app-shell { padding-left:14px; padding-right:14px; }
      .study-toolbar { gap:8px; }
      .flashcard { min-height:380px; padding:16px 14px 14px; }
      .choice { padding:12px 12px; }
      .card-content { font-size:26px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="chapterEyebrow">CAAC 认证 · 第一章</p>
        <h1>无人机基础</h1>
      </div>
      <button class="icon-btn" id="resetBtn" aria-label="重置进度" title="重置进度">↺</button>
    </header>

    <div class="study-toolbar">
      <span class="status-chip">长期记忆</span>
      <div class="progress-donut" id="ring"><span id="ringText">0%</span></div>
      <button class="tab" data-mode="wrong">错题 <span id="wrongCount">0</span></button>
      <button class="tab" id="examTab" data-mode="exam" disabled>理论模拟</button>
    </div>
    <div class="chapter-levels" id="chapterLevels" aria-label="学习关卡"></div>
    <section class="study-plan" aria-live="polite">
      <strong id="stageLabel">当前阶段：逐章通关</strong>
      <span class="daily-reward" id="dailyReward">完成今日任务</span>
      <small id="stageHint">先完成各章节题目，答错题会自动回放。</small>
      <small id="dailyTask">今日任务：0 / 20 题</small>
      <small id="accuracyLabel">本章准确率：暂无数据</small>
    </section>

    <section id="studyView">
      <div class="progress-line"><span id="progressLabel">第 1 / 23 张</span><span id="progressHint">记忆强度</span></div>
      <article class="flashcard" id="flashcard" tabindex="0" aria-label="闪卡，选择答案">
        <div class="card-top"><span id="cardTag">分类识记</span><span id="cardNo">01</span></div>
        <div class="card-content" id="cardContent"></div>
        <div id="recallInstruction" hidden></div><button id="recallBtn" hidden></button>
        <div class="choice-list" id="choiceList"></div>
        <div class="feedback" id="feedback" hidden></div>
        <button class="continue-btn" id="continueBtn" hidden>继续下一题　→</button>
        <div class="flip-tip" id="flipTip">轻触翻面 <span>↗</span></div>
      </article>
    </section>

    <section id="listView" hidden><div class="list-head"><strong id="listTitle">第一章题目</strong><span id="listCount"></span></div><div id="questionList" class="question-list"></div></section>
    <section id="wrongView" hidden><div class="empty-state" id="emptyWrong">还没有错题，先完成几张闪卡吧。</div><div id="wrongList" class="question-list"></div></section>
    <section id="examView" hidden>
      <div class="exam-panel">
        <div class="exam-meta"><span id="examProgress"></span><span class="exam-timer" id="examTimer"></span></div>
        <div class="exam-question">
          <h2 id="examQuestion"></h2>
          <div class="choice-list" id="examChoices"></div>
        </div>
        <div class="exam-actions">
          <button id="examPrev" type="button">上一题</button>
          <button id="examNext" type="button">下一题</button>
          <button id="examSubmit" type="button" hidden>交卷</button>
        </div>
        <div class="exam-result" id="examResult" hidden></div>
      </div>
    </section>

  </main>
  <script src="./questions.js?v=3"></script>
  <script src="./app.js?v=3"></script>
</body>
</html>
