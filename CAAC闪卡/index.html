<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#102a43" />
  <title>CAAC刷题助手</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./interaction.css?v=2" />
  <style>
    :root { --bg:#edf4ff; --panel:#ffffff; --panel-strong:#f5f9ff; --line:#dfeaf7; --navy:#17324d; --muted:#6a7f96; --blue:#2d6cdf; --blue-soft:#e8f0ff; --green:#1e8c6a; --green-soft:#eafaf4; --red:#d9585d; --red-soft:#fff1f1; --mat-surface:#f5f8fd; --mat-why:#fffaf0; --mat-why-line:#e0a72e; --shadow:0 24px 60px rgba(23,50,77,.12); }
    * { box-sizing:border-box; }
    html, body { margin:0; }
    body {
      min-height:100vh;
      background:radial-gradient(circle at top, rgba(112,167,255,.18), transparent 26%), linear-gradient(180deg, #f6faff 0%, #edf3ff 100%);
      color:var(--navy);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;
    }
    .app-shell { width:min(100%, 560px); margin:0 auto; padding:22px 18px 42px; }
    .eyebrow { margin:0 0 4px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .menu-header { margin-bottom:18px; }
    .menu-header h1 { margin:0; font-size:clamp(26px, 6vw, 34px); letter-spacing:-.05em; }
    .icon-btn {
      width:42px; height:42px; border:1px solid rgba(21,46,72,.08); border-radius:14px;
      background:rgba(255,255,255,.82); color:var(--navy); font-size:22px; cursor:pointer;
      box-shadow:0 10px 22px rgba(17,40,59,.08); flex:0 0 auto;
    }
    .icon-btn.small { min-width:44px; min-height:44px; font-size:18px; }
    .mode-menu { display:grid; gap:12px; margin-bottom:6px; }
    .mode-card {
      display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit; color:var(--navy);
      border:1px solid rgba(142,170,204,.26); border-radius:20px; background:rgba(255,255,255,.92);
      padding:16px; box-shadow:0 14px 30px rgba(23,50,77,.08); cursor:pointer;
    }
    .mode-card:disabled { opacity:.55; cursor:not-allowed; }
    .mode-card-icon {
      width:46px; height:46px; border-radius:14px; background:var(--blue-soft); color:var(--blue);
      display:grid; place-items:center; font-size:22px; flex:0 0 auto;
    }
    .mode-card-body { flex:1; display:flex; flex-direction:column; gap:4px; min-width:0; }
    .mode-card-body strong { font-size:17px; }
    .mode-card-body small { color:var(--muted); font-size:12px; }
    .mode-card-arrow { color:var(--muted); font-size:20px; flex:0 0 auto; }
    .mode-bar {
      display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:"back title actions" "progress progress progress" "metrics metrics metrics";
      position:relative;
      align-items:center; gap:8px 10px; margin:0 0 16px; padding:12px 14px 13px;
      border:1px solid rgba(142,170,204,.24); border-radius:20px; background:rgba(255,255,255,.78);
      box-shadow:0 12px 28px rgba(23,50,77,.08); backdrop-filter:blur(12px);
    }
    .mode-bar-main { grid-area:title; min-width:0; display:flex; align-items:center; justify-content:center; min-height:42px; }
    .mode-bar-main { position:absolute; top:12px; left:50%; width:calc(100% - 180px); height:42px; transform:translateX(-50%); pointer-events:none; }
    .mode-bar.daily-mode .mode-bar-main { width:calc(100% - 28px); }
    .mode-bar.daily-mode { margin-bottom:0; border-radius:20px 20px 0 0; box-shadow:0 12px 28px rgba(23,50,77,.08); }
    .mode-bar-title { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:18px; font-weight:850; margin:0; letter-spacing:-.02em; text-align:center; }
    .mode-bar-progress { grid-area:progress; display:flex; align-items:center; gap:9px; }
    .mode-bar-metrics { grid-area:metrics; display:flex; justify-content:flex-end; align-items:center; gap:8px; }
    .bar-track { flex:1; height:10px; border-radius:99px; background:#dfeaf7; overflow:hidden; }
    .bar-fill { height:100%; width:0%; background:linear-gradient(90deg, #64d9b2, #2d6cdf); border-radius:99px; transition:width .2s ease; }
    .bar-count { font-size:11px; color:var(--muted); font-weight:700; white-space:nowrap; }
    .chip {
      appearance:none; border:1px solid rgba(23,50,77,.08); background:rgba(255,255,255,.85);
      color:var(--navy); border-radius:999px; padding:6px 10px; font:inherit; font-size:12px; font-weight:700;
      cursor:pointer; white-space:nowrap; flex:0 0 auto; box-shadow:0 3px 8px rgba(23,50,77,.04);
    }
    .chip-wrong { color:var(--red); }
    .chip-accuracy { color:var(--blue); cursor:default; }
    .mode-bar > #backBtn {
      grid-area:back;
      width:auto;
      width:84px;
      min-width:84px;
      min-height:44px;
      padding:0 12px;
      border-color:rgba(45,108,223,.16);
      background:var(--blue-soft);
      color:var(--blue);
      font-size:14px;
      font-weight:800;
      letter-spacing:.01em;
      white-space:nowrap;
      box-shadow:0 6px 14px rgba(45,108,223,.1);
      transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .mode-bar > #backBtn:hover { background:#dbe8ff; box-shadow:0 8px 18px rgba(45,108,223,.16); transform:translateY(-1px); }
    .mode-bar > #backBtn:active { transform:translateY(0); box-shadow:0 3px 8px rgba(45,108,223,.1); }
    .mode-bar > #resetBtn {
      grid-area:actions;
      width:auto;
      width:84px;
      min-width:84px;
      min-height:44px;
      padding:0 12px;
      border-color:rgba(45,108,223,.16);
      background:var(--blue-soft);
      color:var(--blue);
      font-size:14px;
      font-weight:800;
      letter-spacing:.01em;
      white-space:nowrap;
      box-shadow:0 6px 14px rgba(45,108,223,.1);
      transition:transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .mode-bar > #resetBtn:hover { background:#dbe8ff; box-shadow:0 8px 18px rgba(45,108,223,.16); transform:translateY(-1px); }
    .mode-bar > #resetBtn:active { transform:translateY(0); box-shadow:0 3px 8px rgba(45,108,223,.1); }
    .mode-action-icon { display:inline-block; width:18px; margin-right:4px; font-size:18px; line-height:1; text-align:center; vertical-align:-1px; }
    .progress-line {
      display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; margin:0 4px 12px;
    }
    .progress-line span:first-child { font-weight:700; color:var(--navy); }
    .flashcard {
      background:rgba(255,255,255,.92); border:1px solid rgba(142,170,204,.26); border-radius:28px; min-height:420px;
      padding:18px 18px 16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
    }
    .card-top { display:flex; justify-content:space-between; align-items:center; font-size:12px; }
    .card-top span:first-child {
      display:inline-flex; align-items:center; padding:6px 10px; border-radius:999px;
      background:var(--green-soft); color:var(--green); font-weight:700; border:1px solid rgba(30,140,106,.08);
    }
    .card-top span:last-child { color:var(--muted); }
    .card-content { font-size:clamp(24px, 5vw, 32px); line-height:1.55; font-weight:700; letter-spacing:-.04em; }
    .choice-list { display:grid; gap:10px; margin-top:4px; }
    .choice {
      width:100%; display:flex; align-items:center; gap:12px; border:1px solid rgba(19,35,52,.08); border-radius:16px;
      background:#f9fbff; padding:14px 14px; color:var(--navy); font-size:16px; line-height:1.45;
      text-align:left; font-weight:600; cursor:pointer; transition:transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }
    .choice:hover { transform:translateY(-1px); border-color:rgba(45,108,223,.25); }
    .choice:disabled { cursor:default; opacity:1; }
    .choice span {
      width:28px; height:28px; display:grid; place-items:center; border-radius:50%;
      background:rgba(45,108,223,.08); color:var(--blue); font-size:13px; font-weight:800;
      flex:0 0 auto;
    }
    .choice.correct { background:var(--green-soft); border-color:rgba(30,140,106,.18); }
    .choice.correct span { background:var(--green); color:#fff; }
    .choice.wrong { background:var(--red-soft); border-color:rgba(217,88,93,.2); color:var(--red); }
    .choice.wrong span { background:var(--red); color:#fff; }
    .choice.muted { opacity:.5; }
    .feedback {
      margin-top:2px; padding:12px 14px; border-radius:16px; font-size:15px; line-height:1.7;
      border:1px solid transparent; background:#f5f8fc; color:var(--navy);
    }
    .feedback.good { background:var(--green-soft); border-color:rgba(30,140,106,.12); }
    .feedback.retry { background:var(--red-soft); border-color:rgba(217,88,93,.12); }
    .feedback b { display:block; margin-bottom:4px; }
    .feedback span { color:var(--muted); }
    .memory-guide { display:grid; gap:10px; margin-top:12px; padding:12px; border:1px solid rgba(45,108,223,.14); border-radius:14px; background:var(--mat-surface); color:var(--navy); font-size:14px; line-height:1.55; }
    .mat-header { display:flex; align-items:baseline; gap:6px; padding-bottom:8px; border-bottom:1px solid rgba(45,108,223,.14); color:var(--blue); line-height:1.2; }
    .mat-header span { font-size:13px; font-weight:900; letter-spacing:.04em; }
    .mat-header em { color:var(--muted); font-size:13px; font-style:normal; font-weight:600; }
    .memory-guide > b { display:block; margin-bottom:8px; color:var(--blue); font-size:15px; line-height:1.3; font-weight:850; }
    .guide-note { margin:0; padding:8px 10px; background:var(--mat-why); border-left:3px solid var(--mat-why-line); color:var(--muted); font-size:13px; line-height:1.6; font-weight:400; }
    .review-note { margin-top:8px; padding:7px 8px; background:#fff8e8; border-left:3px solid #e0a72e; color:var(--muted); line-height:1.5; }
    .review-note b { display:inline; margin-right:6px; color:#a56b00; }
    .scale, .scale-labels, .dual-range { display:grid; grid-template-columns:repeat(5, 1fr); gap:3px; text-align:center; }
    .scale span { padding:5px 2px; background:var(--blue-soft); color:var(--blue); font-weight:800; border-bottom:3px solid rgba(45,108,223,.55); }
    .scale-labels { color:var(--muted); font-size:12px; }
    .threshold-value { margin:0; padding:0; background:none; border:0; color:var(--muted); font-size:13px; line-height:1.6; font-weight:400; }
    .threshold-value .guide-note { margin:0; padding:0; border:0; background:none; }
    .threshold-number { margin:4px 0 8px; color:var(--blue); font-size:28px; line-height:1.15; font-weight:900; letter-spacing:0; }
    .classification-ruler { display:grid; grid-template-columns:repeat(4, 1fr); gap:3px; }
    .classification-ruler > div { display:flex; flex-direction:column; gap:4px; min-width:0; padding:8px 6px; background:var(--blue-soft); border-bottom:4px solid rgba(45,108,223,.55); text-align:center; }
    .classification-ruler strong { color:var(--navy); font-size:15px; line-height:1.35; }
    .classification-ruler span { color:var(--blue); font-size:14px; font-weight:800; line-height:1.4; white-space:nowrap; }
    .memory-guide .spec-list { display:grid; grid-template-columns:repeat(auto-fit, minmax(100px, 1fr)); gap:6px; }
    .memory-guide .spec-list > div { display:flex; flex-direction:column; justify-content:center; min-width:0; min-height:58px; padding:9px 8px; border:1px solid rgba(45,108,223,.12); border-bottom:3px solid rgba(45,108,223,.55); border-radius:8px; background:var(--blue-soft); text-align:center; }
    .memory-guide .spec-list strong { color:var(--navy); font-size:14px; line-height:1.35; }
    .memory-guide .spec-list span { display:block; margin-top:3px; color:var(--blue); font-size:14px; font-weight:800; line-height:1.4; white-space:normal; }
    .classification-ruler.heavy { grid-template-columns:repeat(2, 1fr); }
    .classification-ruler.full {
      display:flex;
      gap:6px;
      width:100%;
      max-width:100%;
      min-width:0;
      overflow-x:scroll;
      overflow-y:hidden;
      padding:2px 2px 4px;
      scrollbar-width:thin;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-x;
      overscroll-behavior-x:contain;
    }
    .classification-ruler.full > div {
      flex:0 0 92px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      min-height:78px;
      padding:8px 6px;
      border-radius:10px;
      background:#edf4ff;
      border:1px solid rgba(45,108,223,.1);
      opacity:.62;
      text-align:center;
    }
    .classification-ruler.full strong { font-size:14px; line-height:1.3; }
    .classification-ruler.full span { font-size:12px; line-height:1.35; white-space:normal; }
    .classification-ruler.full .ruler-details { display:flex; flex-direction:column; gap:2px; }
    .classification-ruler.full > div.active {
      opacity:1;
      background:#dff7ef;
      border-color:rgba(30,140,106,.4);
      box-shadow:inset 0 0 0 1px rgba(30,140,106,.2);
      transform:translateY(-1px);
    }
    .classification-ruler.full > div:not(.active) { background:#f2f6ff; }
    .range-ruler { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:8px; color:var(--muted); font-size:11px; }
    .range-track { position:relative; height:10px; border-radius:99px; background:linear-gradient(90deg, #dfeaf7 0 43%, #f2b84b 43% 57%, #64d9b2 57%); }
    .range-track strong { position:absolute; left:50%; top:-20px; transform:translateX(-50%); color:#a56b00; font-size:10px; white-space:nowrap; }
    .dual-range { grid-template-columns:1fr 1fr; gap:8px; }
    .dual-range span { min-height:40px; display:grid; place-items:center; padding:7px; border-radius:8px; background:#e8f0ff; color:var(--blue); font-size:13px; font-weight:800; }
    .dual-range.muted { margin-top:4px; color:var(--muted); }
    .dual-range.muted span { padding:0; background:none; font-weight:400; }
    .formula-guide { display:flex; align-items:center; justify-content:space-between; gap:6px; min-height:42px; padding:8px 10px; background:#e8f0ff; color:var(--blue); font-size:13px; font-weight:800; }
    .formula-guide strong { color:var(--green); font-size:16px; }
    .continue-btn {
      margin-top:auto; border:0; border-radius:14px; background:linear-gradient(135deg, #2d6cdf, #3f8efc);
      color:#fff; min-height:48px; font-size:16px; font-weight:700; box-shadow:0 12px 22px rgba(45,108,223,.24); cursor:pointer;
    }
    .list-head { display:flex; justify-content:space-between; align-items:center; margin:8px 2px 10px; color:var(--muted); font-size:12px; }
    .list-head strong { font-size:13px; color:var(--navy); }
    .question-list { display:grid; gap:10px; }
    .question-item {
      display:grid; grid-template-columns:32px minmax(0,1fr); gap:10px; align-items:flex-start;
      background:rgba(255,255,255,.8); border:1px solid rgba(142,170,204,.22); border-radius:16px; padding:12px 12px;
      width:100%; color:var(--navy); text-align:left; font:inherit; cursor:pointer;
    }
    .question-item:hover { border-color:rgba(45,108,223,.25); box-shadow:0 8px 18px rgba(23,50,77,.08); }
    .qnum { width:32px; height:32px; display:grid; place-items:center; border-radius:10px; background:var(--blue-soft); color:var(--blue); font-size:12px; font-weight:800; }
    .qtext, .qans { font-size:14px; line-height:1.6; color:var(--navy); }
    .qans { margin-top:6px; color:var(--green); }
    .empty-state { padding:20px 16px; border:1px dashed rgba(102,120,145,.32); border-radius:16px; color:var(--muted); background:rgba(255,255,255,.5); }
    .completion-panel { padding:34px 22px 24px; text-align:center; background:rgba(255,255,255,.92); border:1px solid rgba(30,140,106,.18); border-radius:28px; box-shadow:var(--shadow); }
    .completion-mark { width:76px; height:76px; display:grid; place-items:center; margin:0 auto 16px; border-radius:50%; background:var(--green-soft); color:var(--green); font-size:42px; animation:completion-pop .45s ease-out both; }
    .completion-panel h2 { margin:0; font-size:28px; line-height:1.3; }
    .completion-panel p { margin:10px 0 22px; color:var(--muted); line-height:1.7; }
    .completion-stats { display:flex; justify-content:center; gap:10px; margin-bottom:22px; }
    .completion-stat { min-width:88px; padding:10px 8px; border-radius:14px; background:var(--panel-strong); }
    .completion-stat strong { display:block; color:var(--blue); font-size:22px; }
    .completion-stat span { color:var(--muted); font-size:12px; }
    .completion-actions { display:grid; gap:10px; }
    .completion-actions button { min-height:48px; border:1px solid rgba(23,50,77,.1); border-radius:14px; background:#fff; color:var(--navy); font:inherit; font-weight:700; cursor:pointer; }
    .completion-actions button.primary { background:var(--blue); border-color:var(--blue); color:#fff; }
    .completion-actions button.unlock { background:var(--green); border-color:var(--green); color:#fff; animation:unlock-reveal .6s ease-out both; }
    .reset-choice { position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:20px; background:rgba(16,42,67,.28); backdrop-filter:blur(5px); }
    .reset-choice-panel { width:min(100%, 360px); padding:24px 20px 20px; border:1px solid rgba(142,170,204,.3); border-radius:22px; background:#fff; box-shadow:0 24px 60px rgba(23,50,77,.2); }
    .reset-choice-panel h2 { margin:0; color:var(--navy); font-size:21px; }
    .reset-choice-panel p { margin:8px 0 18px; color:var(--muted); font-size:13px; line-height:1.6; }
    .reset-choice-actions { display:grid; gap:9px; }
    .reset-choice-actions button { min-height:46px; border:1px solid rgba(23,50,77,.12); border-radius:13px; background:#fff; color:var(--navy); font:inherit; font-weight:750; cursor:pointer; }
    .reset-choice-actions button.danger { border-color:rgba(217,88,93,.2); background:var(--red-soft); color:var(--red); }
    .reset-choice-actions button:last-child { color:var(--muted); }
    @keyframes completion-pop { from { opacity:0; transform:scale(.72); } to { opacity:1; transform:scale(1); } }
    @keyframes unlock-reveal { 0% { opacity:0; transform:translateY(8px); } 55% { transform:translateY(-2px); } 100% { opacity:1; transform:translateY(0); } }
    .exam-panel { display:grid; gap:14px; }
    .exam-meta { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:13px; }
    .exam-timer { color:var(--blue); font-weight:800; font-variant-numeric:tabular-nums; }
    .exam-question { background:rgba(255,255,255,.92); border:1px solid rgba(142,170,204,.26); border-radius:24px; padding:20px 18px; box-shadow:var(--shadow); }
    .exam-question h2 { margin:0 0 18px; font-size:22px; line-height:1.55; }
    .exam-question .choice.exam-selected { background:var(--blue-soft); border-color:rgba(45,108,223,.3); }
    .exam-question .choice.exam-selected span { background:var(--blue); color:#fff; }
    .exam-actions { display:flex; gap:10px; }
    .exam-actions button { flex:1; min-height:48px; border:1px solid rgba(23,50,77,.1); border-radius:14px; background:#fff; color:var(--navy); font:inherit; font-weight:700; cursor:pointer; }
    .exam-actions button:last-child { background:var(--blue); color:#fff; border-color:var(--blue); }
    .exam-result { background:var(--green-soft); border:1px solid rgba(30,140,106,.15); border-radius:18px; padding:18px; line-height:1.8; }
    .exam-result.fail { background:var(--red-soft); border-color:rgba(217,88,93,.15); }
    .chapter-levels { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:8px; margin:0 0 16px; }
    .level-btn { min-height:38px; border:1px solid rgba(23,50,77,.1); border-radius:10px; background:rgba(255,255,255,.76); color:var(--navy); font:inherit; font-size:12px; font-weight:700; cursor:pointer; }
    .level-btn.active { background:var(--blue); border-color:var(--blue); color:#fff; }
    .level-btn.complete { border-color:rgba(30,140,106,.25); color:var(--green); }
    .level-btn:disabled { color:#9aafbe; background:rgba(231,238,246,.72); cursor:not-allowed; }
    .daily-calendar { margin:0 0 16px; padding:14px 16px 16px; border:1px solid rgba(142,170,204,.24); border-top:0; border-radius:0 0 20px 20px; background:rgba(255,255,255,.82); box-shadow:0 12px 28px rgba(23,50,77,.08); }
    .daily-calendar-summary { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .daily-calendar-summary strong { font-size:15px; }
    .daily-calendar-summary small { display:block; margin-top:4px; color:var(--muted); font-size:12px; }
    .calendar-summary-mark { border:0; padding:6px 0; background:transparent; color:var(--blue); font:inherit; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; }
    .calendar-summary-mark:hover { color:var(--navy); }
    .daily-calendar .calendar-head, .daily-calendar .calendar-week, .daily-calendar .calendar-grid { display:none; }
    .daily-calendar.expanded .calendar-head { display:flex; margin-top:14px; }
    .daily-calendar.expanded .calendar-week { display:grid; }
    .daily-calendar.expanded .calendar-grid { display:grid; }
    .calendar-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
    .calendar-head strong { font-size:16px; }
    .calendar-nav { display:flex; gap:6px; }
    .calendar-nav button { width:32px; height:32px; border:1px solid var(--line); border-radius:9px; background:#fff; color:var(--navy); font:inherit; cursor:pointer; }
    .calendar-nav button:disabled { color:#b8c5d2; cursor:not-allowed; }
    .calendar-week, .calendar-grid { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:5px; }
    .calendar-week { margin-bottom:5px; color:var(--muted); font-size:11px; text-align:center; }
    .calendar-day { min-width:0; min-height:49px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:1px solid transparent; border-radius:10px; background:var(--panel-strong); color:var(--muted); }
    .calendar-day b { font-size:14px; line-height:1; }
    .calendar-day small { max-width:100%; overflow:hidden; font-size:9px; white-space:nowrap; text-overflow:ellipsis; }
    .calendar-day.empty { background:transparent; }
    .calendar-day.today { border-color:var(--blue); background:var(--blue-soft); color:var(--blue); }
    .calendar-day.checked { background:var(--green-soft); color:var(--green); }
    .calendar-day.expired { color:#a5afba; background:#f3f5f7; }
    .calendar-day.future { opacity:.55; }
    .calendar-status { display:none; margin:10px 0 0; color:var(--muted); font-size:12px; text-align:center; }
    [hidden] { display:none !important; }
    @media (max-width:420px) {
      .app-shell { padding-left:14px; padding-right:14px; }
      .mode-bar { gap:8px; padding:11px 10px 12px; }
      .mode-bar-main { min-width:0; }
      .mode-bar > .mode-bar-main { padding-left:0; }
      .chip { padding-left:8px; padding-right:8px; }
      .flashcard { min-height:380px; padding:16px 14px 14px; }
      .choice { padding:12px 12px; }
      .card-content { font-size:26px; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section id="menuView">
      <header class="menu-header">
        <p class="eyebrow">CAAC 认证 · 超视距多旋翼</p>
        <h1>刷题速记助手</h1>
      </header>
      <div class="mode-menu">
        <button class="mode-card" id="modeChapters" type="button">
          <span class="mode-card-icon">📖</span>
          <span class="mode-card-body">
            <strong>逐章刷题</strong>
            <small id="modeChaptersDesc">第 1 章 · 0/0 题已练习</small>
          </span>
          <span class="mode-card-arrow">›</span>
        </button>
        <button class="mode-card" id="modeDaily" type="button">
          <span class="mode-card-icon">🗓️</span>
          <span class="mode-card-body">
            <strong>每日签到</strong>
            <small id="modeDailyDesc">今日 0/20 题</small>
          </span>
          <span class="mode-card-arrow">›</span>
        </button>
        <button class="mode-card" id="modeExam" type="button" disabled>
          <span class="mode-card-icon">📝</span>
          <span class="mode-card-body">
            <strong>理论模拟</strong>
            <small id="modeExamDesc">完成全部章节后解锁</small>
          </span>
          <span class="mode-card-arrow">›</span>
        </button>
      </div>
    </section>

    <div class="mode-bar" id="modeBar" hidden>
      <button class="icon-btn small" id="backBtn" type="button" aria-label="返回模式选择" title="返回模式选择"><span class="mode-action-icon">←</span>返回</button>
      <div class="mode-bar-main">
        <p class="mode-bar-title" id="modeBarTitle">逐章刷题</p>
      </div>
      <button class="icon-btn small" id="resetBtn" type="button" aria-label="重置进度" title="重置进度"><span class="mode-action-icon">↺</span>重置</button>
      <div class="mode-bar-progress">
          <div class="bar-track"><div class="bar-fill" id="modeBarFill"></div></div>
          <span class="bar-count" id="modeBarCount">0/0</span>
      </div>
      <div class="mode-bar-metrics">
        <button class="chip chip-accuracy" id="accuracyChip" type="button">准确率 --</button>
        <button class="chip chip-wrong" id="wrongChip" type="button">错题 <b id="wrongCount">0</b></button>
      </div>
    </div>

    <div class="reset-choice" id="resetChoice" hidden>
      <div class="reset-choice-panel" role="dialog" aria-modal="true" aria-labelledby="resetChoiceTitle">
        <h2 id="resetChoiceTitle">选择重置范围</h2>
        <p id="resetChoiceMessage">请选择要清除的学习进度。</p>
        <div class="reset-choice-actions">
          <button id="resetChapter" type="button">重置本章</button>
          <button class="danger" id="resetGlobal" type="button">全局重置</button>
          <button id="resetCancel" type="button">取消</button>
        </div>
      </div>
    </div>

    <div class="chapter-levels" id="chapterLevels" aria-label="学习关卡" hidden></div>

    <section class="daily-calendar" id="dailyCalendar" hidden aria-label="每日签到日历">
      <div class="daily-calendar-summary"><strong id="calendarToday">今天</strong><button class="calendar-summary-mark" id="calendarToggle" type="button" aria-expanded="false">签到记录</button></div>
      <div class="calendar-head"><strong id="calendarTitle">签到日历</strong><div class="calendar-nav"><button id="calendarPrev" type="button" aria-label="上个月">‹</button><button id="calendarNext" type="button" aria-label="下个月">›</button></div></div>
      <div class="calendar-week" aria-hidden="true"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
      <div class="calendar-grid" id="dailyCalendarGrid"></div>
      <p class="calendar-status" id="dailyCalendarStatus"></p>
    </section>

    <section id="studyView" hidden>
      <div class="progress-line"><span id="progressLabel">第 1 / 23 张</span><span id="progressHint">记忆强度</span></div>
      <article class="flashcard" id="flashcard" tabindex="0" aria-label="闪卡，选择答案">
        <div class="card-top"><span id="cardTag">分类识记</span><span id="cardNo">01</span></div>
        <div class="card-content" id="cardContent"></div>
        <div id="recallInstruction" hidden></div><button id="recallBtn" hidden></button>
        <div class="choice-list" id="choiceList"></div>
        <div class="feedback" id="feedback" hidden></div>
        <button class="continue-btn" id="continueBtn" hidden>继续下一题　→</button>
        <div class="flip-tip" id="flipTip">轻触翻面 <span>↗</span></div>
      </article>
    </section>
    <section id="completionView" hidden>
      <div class="completion-panel">
        <div class="completion-mark">✓</div>
        <h2 id="completionTitle">完成！</h2>
        <p id="completionMessage"></p>
        <div class="completion-stats">
          <div class="completion-stat"><strong id="completionDone">0/0</strong><span>完成题数</span></div>
          <div class="completion-stat"><strong id="completionAccuracy">--</strong><span>正确率</span></div>
        </div>
        <div class="completion-actions">
          <button class="primary" id="completionHome" type="button">返回模式选择</button>
          <button class="unlock" id="completionNext" type="button" hidden>解锁下一章 →</button>
          <button id="completionWrong" type="button">复习错题</button>
          <button id="completionContinue" type="button">继续复习</button>
        </div>
      </div>
    </section>

    <section id="wrongView" hidden><div class="empty-state" id="emptyWrong">还没有错题，先完成几张闪卡吧。</div><div id="wrongList" class="question-list"></div></section>
    <section id="examView" hidden>
      <div class="exam-panel">
        <div class="exam-meta"><span id="examProgress"></span><span class="exam-timer" id="examTimer"></span></div>
        <div class="exam-question">
          <h2 id="examQuestion"></h2>
          <div class="choice-list" id="examChoices"></div>
        </div>
        <div class="exam-actions">
          <button id="examPrev" type="button">上一题</button>
          <button id="examNext" type="button">下一题</button>
          <button id="examSubmit" type="button" hidden>交卷</button>
        </div>
        <div class="exam-result" id="examResult" hidden></div>
      </div>
    </section>

  </main>
  <script src="./questions.js?v=7"></script>
  <script src="./app.js?v=7"></script>
</body>
</html>
